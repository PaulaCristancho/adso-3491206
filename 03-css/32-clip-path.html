<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        div.clip {
            background: url(imgs/pittsburgh.jpg) no-repeat center;
            background-size: cover;
            height: 280px;
            margin-block: 1rem;
            margin-inline: auto;
            transition: all 0.4s ease-in;
            width: 320px;
        }
        div.clip1 {
            clip-path: polygon(50% 0, 50% 0, 100% 100%, 0% 100%);
        }
        div.clip2 {
            clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
        }
        div.clip1:hover {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }
        div.clip2:hover {
            clip-path: polygon(20% 0%, 0% 20%, 0 50%, 0% 80%, 20% 100%, 49% 100%, 80% 100%, 100% 80%, 100% 50%, 100% 20%, 80% 0%, 50% 0);
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="#000000" viewBox="0 0 256 256"><path d="M232,56A104.11,104.11,0,0,1,128,160H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,104v40h40a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>32-clip-path</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3> Propiedad que define una región de recorte para mostrar solo una porción específica del elemento (usando formas como circle(), polygon() o rutas SVG).</h3>
        </header>
        <section>
            <h2 class="subtitle">Example 01:</h2>
            <div class="clip clip1"></div>
            <h2 class="subtitle">Example 02:</h2>
            <div class="clip clip2"></div>
        </section>
    </main>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-transformations</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            img {
                display: block;
                margin: 2rem auto;

                &.transform1 {
                    transform: rotate(90deg); /*0.25turn*/
                }
                &.transform2 {
                    transform: scale(0.5);
                }
                &.transform3 {
                    transform: TranslateX(-100px);
                }
                &.transform4 {
                    transform: skew(30deg);
                }
                &.transform5 {
                    transform: rotate(45deg) scale(1.4);
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="#000000" viewBox="0 0 256 256"><path d="M232,56A104.11,104.11,0,0,1,128,160H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,104v40h40a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>35-transformations</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3> Propiedad (transform) que permite la manipulación 2D o 3D de elementos, como translate(), rotate(), scale() y skew().</h3>
        </header>
        <section>
            <h2 class="subtitle">Rotate: 90deg</h2>
            <img class="transform1" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">Scale: 0.5</h2>
            <img class="transform2" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">TranslateX: -100px</h2>
            <img class="transform3" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">Skew: 30deg</h2>
            <img class="transform4" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">Rotate Scale:</h2>
            <img class="transform5" src="imgs/mario.png" width="180px">
        </section>
    </main>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-transitions</title>
    <link rel="stylesheet" href="../src/css/styles.css">
</head>
<style>
    section {
        img {
            display: block;
            margin: 1rem auto;

            &.transition01 {
                transition: transform 0.5s ease-in;

                &:hover {
                    transform: scale(1.3);
                }
            }

            &.transition02 {
                transition: all 1s linear;

                &:hover {
                    transform: rotate(0.5turn); /*180deg*/
                }
            }

            &.transition03 {
                transition: transform 0.5s ease-in-out;

                &:hover {
                    transform: rotatey(180deg);
                }
            }

            &.transition04 {
                transition: transform 0.2s ease-in;

                &:hover {
                    transform: translatex(80px);
                }
            }
        }
        div.box {
            background-color: aqua;
            margin-bottom: 2rem;
            height: 100px;
            width: 100px;
            transition: width 0.5s ease,
                        height 0.5s 0.5s ease-in,
                        background 1s 1s ease-out,
                        transform 0.5s 2s linear;

            &:hover {
                background: #e70404;
                width: 380px;
                transform: rotate(360deg);
                height: 200px;
            }

        }
    }
</style>
<body class="css">
    <nav class="back">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="#000000" viewBox="0 0 256 256"><path d="M232,56A104.11,104.11,0,0,1,128,160H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,104v40h40a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>36-transitions</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3> Técnica que controla la velocidad y la curva de tiempo al cambiar suavemente los valores de las propiedades ante un cambio de estado (ej. en :hover).</h3>
        </header>
        <section>
            <h2 class="subtitle">Scale(1.3):</h2>
            <img class="transition01" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">Rotate(-0.5turn):</h2>
            <img class="transition02" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">RotateY(180deg):</h2>
            <img class="transition03" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">TranslateX(80px):</h2>
            <img class="transition04" src="imgs/dk.png" alt="DK">
            <h2 class="subtitle">Multiple:</h2>
            <div class="box"></div>
        </section>
    </main>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-streps</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
:root {
    --size: 256px;
}

section {
    div.bg {
        background: url(imgs/bg-steps.png) no-repeat center / cover;
        border-radius: 12px;
        outline: 4px solid white;
        corner-shape: squircle;
        position: relative;
        height: 540px;

        div.trainer {
            background: url(imgs/steps-all.png) no-repeat;
            position: absolute;
            bottom: 0;
            left: 4rem;
            transform: scale(.8);
            height: var(--size);
            width: var(--size);

            animation: anim 0.6s steps(4) infinite;

            &.front {
                background-position-x: 0;
            }

            &.left {
                background-position-x: calc(var(--size) * -1);
            }

            &.right {
                background-position-x: calc(var(--size) * -2);
            }

            &.back {
                background-position-x: calc(var(--size) * -3);
            }
        }
    }
}

@keyframes anim {
    100% {
        background-position-x: calc(var(--size) * -4);
    }
}
</style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="#000000" viewBox="0 0 256 256"><path d="M232,56A104.11,104.11,0,0,1,128,160H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,104v40h40a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>40-streps</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Función de tiempo (steps()) utilizada en animaciones CSS para dividir una transición en fotogramas discretos, común en animaciones estilo sprite fotograma a fotograma.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example: </h2>
            <div class="bg">
                <div class="trainer front"></div>
            </div>
        </section>
    </main>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/styles.css">
<style>
    section {

        .batman {
            display: grid;
            margin-bottom: 100px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            grid-gap: 10px;
            height: 90dvh; 
            padding: 10px;
            box-sizing: border-box;
            background: #5e6572;

            .ite02 {
                grid-column-start: 2;
                grid-column-end: 3;
                grid-row-start: 1;
                grid-row-end: 3;
            }

            .ite06 {
                grid-column-start: 1;
                grid-column-end: 3;
                grid-row-start: 3;
                grid-row-end: 4;
            }

            & > div {
                overflow: hidden;
                border-radius: 12px;
                border: 2px solid #ffffff;
            }

            & img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        }

.gumbal {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    grid-gap: 10px;
    width: 100%;
    max-width: 800px;
    height: 100dvh;
    padding: 10px;
    box-sizing: border-box;
    background: #9db4e2;

    .item1 {
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
    }

    .item4 {
        grid-column-start: 3;
        grid-column-end: 5;
        grid-row-start: 2;
        grid-row-end: 4;
    }

    & > div {
        overflow: hidden;
        border-radius: 12px;
        border: 2px solid #ffffff;
    }

    & img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
}
}
</style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" fill="#000000" viewBox="0 0 256 256"><path d="M232,56A104.11,104.11,0,0,1,128,160H88v40a8,8,0,0,1-13.66,5.66l-48-48a8,8,0,0,1,0-11.32l48-48A8,8,0,0,1,88,104v40h40a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>45-challenge-grid</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Ejercicio práctico para construir una galería de imágenes irregular y dinámica utilizando las propiedades de expansión de CSS Grid (grid-column, grid-row).</h3>
        </header>
        <section>
            <h2 class="subtitle">Example: </h2>
            <div class="batman">
                <div class="ite01"><img src="imgs/batman/batman1.jpg" alt=""></div>
                <div class="ite02"><img src="imgs/batman/batman2.jpg" alt=""></div>
                <div class="ite03"><img src="imgs/batman/batman3.jpg" alt=""></div>
                <div class="ite04"><img src="imgs/batman/batman4.jpg" alt=""></div>
                <div class="ite05"><img src="imgs/batman/batman5.jpg" alt=""></div>
                <div class="ite06"><img src="imgs/batman/batman6.jpg" alt=""></div>
                <div class="ite07"><img src="imgs/batman/batman7.jpg" alt=""></div>
            </div>
            <div class="gumbal">
                <div class="item1"><img src="imgs/gumball/gumbal1.jpg" alt=""></div>
                <div class="item2"><img src="imgs/gumball/gumbal2.jpg" alt=""></div>
                <div class="item3"><img src="imgs/gumball/gumbal3.jpg" alt=""></div>
                <div class="item4"><img src="imgs/gumball/gumbal4.jpg" alt=""></div>
                <div class="item5"><img src="imgs/gumball/gumbal5.jpg" alt=""></div>
                <div class="item6"><img src="imgs/gumball/gumbal6.jpg" alt=""></div>
            </div>
        </section>
    </main>
